# Conda environment for the Scanpy-heavy part of paper_code (not the full multi-env server).
# Create: conda env create -f environment.yml
# Activate: conda activate satglia-scanpy
#
# R steps (ArchR, CellChat, Monocle3) and SCENIC+/CellOracle use **other** envs on the authors'
# machine; see requirements-r.txt and requirements-scenicplus.txt + Table S6.

name: satglia-scanpy
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.11
  - scanpy=1.12.1
  - anndata=0.12.17
  - harmonypy=2.0.0
  - matplotlib=3.10.8
  - numpy=2.4.*
  - pandas=2.3.*
  - scipy=1.17.*
  - scikit-learn=1.9.*
  - h5py
  - networkx
  - requests
  - pillow
  - pip
  - pip:
      - -r requirements.txt