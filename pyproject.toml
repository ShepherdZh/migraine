[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "satglia-migraine-tg"
version = "0.1.0"
description = "Analysis code for Satglia–PEP GSE197289 reanalysis (MDPI Biology manuscript)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Yi Zhu", email = "zhuyi986@sina.com" }]
keywords = ["migraine", "single-cell", "trigeminal ganglion", "scanpy"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

dependencies = [
    "anndata>=0.10,<0.13",
    "h5py>=3.8",
    "harmonypy>=0.3.4",
    "matplotlib>=3.8",
    "networkx>=3.0",
    "numpy>=1.24",
    "pandas>=2.0",
    "requests>=2.28",
    "scanpy>=1.9.8",
    "scikit-learn>=1.3",
    "scipy>=1.11",
    "Pillow>=10.0",
]

[project.optional-dependencies]
scenicplus = [
    "celloracle>=0.12.0",
    "dill>=0.3.8",
    "mudata>=0.2.0",
]
# scenicplus, pycistarget, pycisTopic: install from GitHub per Aerts lab instructions.

[project.urls]
Repository = "https://github.com/ShepherdZh/satglia-migraine-tg"
"Data availability" = "https://www.ncbi.nlm.nih.gov/geo/query/acc.cgi?acc=GSE197289"

[tool.setuptools]
packages = []